<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monster Munch — Math Adventure!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #fef3c7;
    --btn1: #f87171;
    --btn2: #60a5fa;
    --btn3: #34d399;
    --btn4: #fbbf24;
    --monster: #a78bfa;
  }

  body {
    font-family: 'Nunito', 'Fredoka One', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.6s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .game-container {
    width: 100%;
    max-width: 480px;
    padding: 20px;
    text-align: center;
    position: relative;
  }

  /* ---- START SCREEN ---- */
  .screen { display: none; flex-direction: column; align-items: center; gap: 18px; }
  .screen.active { display: flex; }

  .title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 8vw, 3.2rem);
    color: #7c3aed;
    text-shadow: 3px 3px 0 #ddd6fe;
    line-height: 1.2;
  }

  .subtitle {
    font-size: clamp(1rem, 4vw, 1.3rem);
    color: #6b7280;
  }

  .play-btn {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 5vw, 1.8rem);
    padding: 18px 56px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #4c1d95, 0 8px 20px rgba(0,0,0,0.15);
    transition: transform 0.1s, box-shadow 0.1s;
    margin-top: 10px;
  }
  .play-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #4c1d95, 0 4px 10px rgba(0,0,0,0.12);
  }

  /* ---- MONSTER ---- */
  .monster-wrap {
    position: relative;
    width: 140px;
    height: 160px;
    margin: 0 auto;
  }

  .monster {
    width: 120px;
    height: 120px;
    background: var(--monster);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: transform 0.3s ease;
  }

  .monster-eyes {
    display: flex;
    gap: 18px;
    margin-top: -4px;
  }
  .eye {
    width: 26px;
    height: 30px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pupil {
    width: 12px;
    height: 14px;
    background: #1e1b4b;
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .monster-mouth {
    width: 36px;
    height: 18px;
    background: #e11d48;
    border-radius: 0 0 50% 50%;
    margin-top: 6px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
  }
  .monster-mouth::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 8px;
    background: #fb7185;
    border-radius: 50% 50% 0 0;
  }

  /* Monster states */
  .monster.happy {
    animation: monsterBounce 0.5s ease 2;
  }
  .monster.happy .monster-mouth {
    width: 44px;
    height: 24px;
    border-radius: 0 0 50% 50%;
  }

  .monster.sad .pupil {
    transform: translateY(4px);
  }
  .monster.sad .monster-mouth {
    width: 30px;
    height: 8px;
    border-radius: 50%;
    background: #6b7280;
  }
  .monster.sad {
    animation: monsterShake 0.4s ease;
  }

  @keyframes monsterBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    40% { transform: translateX(-50%) translateY(-20px) scale(1.08); }
    60% { transform: translateX(-50%) translateY(-8px); }
  }

  @keyframes monsterShake {
    0%, 100% { transform: translateX(-50%) rotate(0); }
    20% { transform: translateX(-50%) rotate(-8deg); }
    40% { transform: translateX(-50%) rotate(8deg); }
    60% { transform: translateX(-50%) rotate(-5deg); }
    80% { transform: translateX(-50%) rotate(5deg); }
  }

  /* Crown / streak hat */
  .crown {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%) scale(0);
    font-size: 36px;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .crown.visible {
    transform: translateX(-50%) scale(1);
  }

  /* ---- PROBLEM SCREEN ---- */
  .problem-text {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.4rem, 10vw, 3.8rem);
    color: #1e1b4b;
    margin: 10px 0;
    min-height: 1.3em;
  }

  .score-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 1rem;
    font-weight: 800;
    color: #6d28d9;
    padding: 0 4px;
  }

  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    margin-top: 10px;
  }

  .answer-btn {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.5rem, 6vw, 2rem);
    padding: 16px 10px;
    min-height: 64px;
    border: none;
    border-radius: 18px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 6px 14px rgba(0,0,0,0.1);
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.3s, filter 0.3s;
  }
  .answer-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.1);
  }
  .answer-btn:nth-child(1) { background: var(--btn1); }
  .answer-btn:nth-child(2) { background: var(--btn2); }
  .answer-btn:nth-child(3) { background: var(--btn3); }
  .answer-btn:nth-child(4) { background: var(--btn4); color: #78350f; }

  .answer-btn.correct-reveal {
    animation: pulseCorrect 0.6s ease 3;
    filter: brightness(1.2);
    transform: scale(1.08);
  }
  .answer-btn.wrong-pick {
    opacity: 0.4;
    filter: grayscale(0.6);
  }
  .answer-btn.dim {
    opacity: 0.4;
    filter: grayscale(0.6);
  }

  @keyframes pulseCorrect {
    0%, 100% { transform: scale(1.08); }
    50% { transform: scale(1.15); }
  }

  /* Feedback message */
  .feedback {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    min-height: 2em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }
  .feedback.correct-msg { color: #16a34a; }
  .feedback.wrong-msg { color: #dc2626; }

  /* ---- STARS / CONFETTI ---- */
  .stars-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .star {
    position: absolute;
    font-size: 28px;
    animation: starBurst 0.9s ease-out forwards;
  }

  @keyframes starBurst {
    0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
    60% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(360deg); opacity: 0; }
  }

  /* ---- CELEBRATION SCREEN ---- */
  .celebration-screen .title {
    font-size: clamp(1.8rem, 7vw, 2.6rem);
  }

  .big-score {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(3rem, 12vw, 5rem);
    color: #f59e0b;
    text-shadow: 3px 3px 0 #fbbf24;
  }

  .stat-line {
    font-size: 1.1rem;
    font-weight: 800;
    color: #7c3aed;
  }

  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    top: -20px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Background color sets */
  .bg0 { --bg: #fef3c7; }
  .bg1 { --bg: #dbeafe; }
  .bg2 { --bg: #d1fae5; }
  .bg3 { --bg: #fce7f3; }
  .bg4 { --bg: #ede9fe; }
  .bg5 { --bg: #ffedd5; }
</style>
</head>
<body class="bg0">

<div class="game-container">

  <!-- START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="monster-wrap">
      <div class="crown" id="start-crown">👑</div>
      <div class="monster" id="start-monster">
        <div class="monster-eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="monster-mouth"></div>
      </div>
    </div>
    <div class="title">Monster Munch!</div>
    <div class="subtitle">Feed the monster with math!</div>
    <button class="play-btn" id="play-btn">PLAY</button>
  </div>

  <!-- PROBLEM SCREEN -->
  <div id="problem-screen" class="screen">
    <div class="score-bar">
      <span id="score-display">Score: 0</span>
      <span id="streak-display">Streak: 0</span>
    </div>
    <div class="monster-wrap">
      <div class="crown" id="game-crown">👑</div>
      <div class="monster" id="game-monster">
        <div class="monster-eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="monster-mouth"></div>
      </div>
    </div>
    <div class="problem-text" id="problem-text"></div>
    <div class="feedback" id="feedback">&nbsp;</div>
    <div class="answers" id="answers">
      <button class="answer-btn" data-idx="0"></button>
      <button class="answer-btn" data-idx="1"></button>
      <button class="answer-btn" data-idx="2"></button>
      <button class="answer-btn" data-idx="3"></button>
    </div>
  </div>

  <!-- CELEBRATION SCREEN -->
  <div id="celebration-screen" class="screen celebration-screen">
    <div class="monster-wrap">
      <div class="crown visible">👑</div>
      <div class="monster happy" id="celeb-monster">
        <div class="monster-eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="monster-mouth"></div>
      </div>
    </div>
    <div class="title">Great Job!</div>
    <div class="big-score" id="celeb-score">0</div>
    <div class="stat-line" id="celeb-streak">Best streak: 0</div>
    <div class="stat-line" id="celeb-total">Problems: 0 / 10</div>
    <button class="play-btn" id="continue-btn">KEEP GOING!</button>
  </div>

</div>

<div class="stars-container" id="stars-container"></div>
<div class="confetti-container" id="confetti-container"></div>

<script>
// ===== STATE =====
let score = 0;
let streak = 0;
let bestStreak = 0;
let totalProblems = 0;
let currentAnswer = 0;
let accepting = false;
let audioCtx = null;

// ===== ELEMENTS =====
const $ = id => document.getElementById(id);
const startScreen = $('start-screen');
const problemScreen = $('problem-screen');
const celebrationScreen = $('celebration-screen');
const problemText = $('problem-text');
const feedback = $('feedback');
const scoreDisplay = $('score-display');
const streakDisplay = $('streak-display');
const answerBtns = document.querySelectorAll('.answer-btn');
const gameCrown = $('game-crown');
const gameMonster = $('game-monster');
const starsContainer = $('stars-container');
const confettiContainer = $('confetti-container');

// ===== SCREENS =====
function showScreen(screen) {
  [startScreen, problemScreen, celebrationScreen].forEach(s => s.classList.remove('active'));
  screen.classList.add('active');
}

// ===== AUDIO =====
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playDingDing() {
  ensureAudio();
  const now = audioCtx.currentTime;
  // First ding
  playTone(800, now, 0.12, 'sine', 0.3);
  // Second ding (higher)
  playTone(1000, now + 0.15, 0.12, 'sine', 0.3);
}

function playWompWomp() {
  ensureAudio();
  const now = audioCtx.currentTime;
  // First womp (descending)
  playBend(300, 250, now, 0.25, 'triangle', 0.3);
  // Second womp (lower, descending)
  playBend(250, 180, now + 0.3, 0.35, 'triangle', 0.25);
}

function playTone(freq, startTime, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playBend(freqStart, freqEnd, startTime, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, startTime);
  osc.frequency.linearRampToValueAtTime(freqEnd, startTime + duration);
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

// ===== PROBLEM GENERATION =====
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateProblem() {
  const types = ['add1', 'add2', 'nearDouble', 'sub1', 'sub2'];
  const type = types[randInt(0, types.length - 1)];
  let a, b, answer, text;

  switch (type) {
    case 'add1':
      a = randInt(1, 9);
      b = 1;
      answer = a + b;
      text = `${a} + ${b} = ?`;
      break;
    case 'add2':
      a = randInt(1, 8);
      b = 2;
      answer = a + b;
      text = `${a} + ${b} = ?`;
      break;
    case 'nearDouble': {
      const base = randInt(1, 9);
      // Randomly present as base+(base+1) or (base+1)+base
      if (Math.random() < 0.5) {
        a = base; b = base + 1;
      } else {
        a = base + 1; b = base;
      }
      answer = a + b;
      text = `${a} + ${b} = ?`;
      break;
    }
    case 'sub1':
      a = randInt(2, 10);
      b = 1;
      answer = a - b;
      text = `${a} − ${b} = ?`;
      break;
    case 'sub2':
      a = randInt(3, 10);
      b = 2;
      answer = a - b;
      text = `${a} − ${b} = ?`;
      break;
  }

  return { answer, text };
}

function generateChoices(correct) {
  const choices = new Set([correct]);
  // Generate plausible wrong answers near the correct one
  const offsets = [-2, -1, 1, 2, 3, -3];
  // Shuffle offsets
  for (let i = offsets.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [offsets[i], offsets[j]] = [offsets[j], offsets[i]];
  }
  for (const off of offsets) {
    if (choices.size >= 4) break;
    const val = correct + off;
    if (val >= 0 && val !== correct) choices.add(val);
  }
  // If still not enough (unlikely), add more
  let extra = 1;
  while (choices.size < 4) {
    const val = correct + extra;
    if (!choices.has(val) && val >= 0) choices.add(val);
    extra++;
  }
  // Shuffle
  const arr = Array.from(choices);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== EFFECTS =====
function spawnStars() {
  starsContainer.innerHTML = '';
  const emojis = ['⭐', '🌟', '✨', '💫', '🎉'];
  for (let i = 0; i < 12; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.textContent = emojis[randInt(0, emojis.length - 1)];
    const angle = (i / 12) * Math.PI * 2;
    const dist = randInt(80, 180);
    star.style.left = '50%';
    star.style.top = '50%';
    star.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    star.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    star.style.animationDelay = `${Math.random() * 0.15}s`;
    starsContainer.appendChild(star);
  }
  setTimeout(() => { starsContainer.innerHTML = ''; }, 1200);
}

function spawnConfetti() {
  confettiContainer.innerHTML = '';
  const colors = ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#fb923c', '#f472b6'];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = `${randInt(0, 100)}%`;
    piece.style.background = colors[randInt(0, colors.length - 1)];
    piece.style.width = `${randInt(6, 14)}px`;
    piece.style.height = `${randInt(6, 14)}px`;
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = `${1.5 + Math.random() * 2}s`;
    piece.style.animationDelay = `${Math.random() * 0.6}s`;
    confettiContainer.appendChild(piece);
  }
  setTimeout(() => { confettiContainer.innerHTML = ''; }, 4000);
}

function cycleBg() {
  const idx = randInt(0, 5);
  document.body.className = `bg${idx}`;
}

// ===== GAME LOGIC =====
const happyMessages = ['YUM!', 'DELICIOUS!', 'MORE MORE MORE!', 'SO TASTY!', 'NOM NOM!', 'YUMMY!', 'AWESOME!', 'WOW!'];
const sadMessages = ['Oops!', 'Not quite!', 'So close!', 'Almost!'];

function updateUI() {
  scoreDisplay.textContent = `Score: ${score}`;
  streakDisplay.textContent = `Streak: ${streak}`;
  // Crown appears at streak >= 3
  if (streak >= 3) {
    gameCrown.classList.add('visible');
  } else {
    gameCrown.classList.remove('visible');
  }
}

function nextProblem() {
  cycleBg();
  const problem = generateProblem();
  currentAnswer = problem.answer;
  problemText.textContent = problem.text;
  feedback.innerHTML = '&nbsp;';
  feedback.className = 'feedback';

  const choices = generateChoices(currentAnswer);
  answerBtns.forEach((btn, i) => {
    btn.textContent = choices[i];
    btn.dataset.value = choices[i];
    btn.className = 'answer-btn';
    btn.disabled = false;
  });

  gameMonster.className = 'monster';
  accepting = true;
}

function handleAnswer(btn) {
  if (!accepting) return;
  accepting = false;

  const chosen = parseInt(btn.dataset.value);

  if (chosen === currentAnswer) {
    // CORRECT
    score++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    totalProblems++;
    updateUI();

    playDingDing();
    gameMonster.className = 'monster happy';
    spawnStars();

    const msg = happyMessages[randInt(0, happyMessages.length - 1)];
    feedback.textContent = msg;
    feedback.className = 'feedback correct-msg';

    btn.classList.add('correct-reveal');

    setTimeout(() => {
      if (totalProblems > 0 && totalProblems % 10 === 0) {
        showCelebration();
      } else {
        nextProblem();
      }
    }, 1200);

  } else {
    // WRONG
    streak = 0;
    totalProblems++;
    updateUI();

    playWompWomp();
    gameMonster.className = 'monster sad';

    btn.classList.add('wrong-pick');

    // Highlight correct answer
    answerBtns.forEach(b => {
      if (parseInt(b.dataset.value) === currentAnswer) {
        b.classList.add('correct-reveal');
      } else if (b !== btn) {
        b.classList.add('dim');
      }
    });

    const msg = `${sadMessages[randInt(0, sadMessages.length - 1)]} It's ${currentAnswer}!`;
    feedback.textContent = msg;
    feedback.className = 'feedback wrong-msg';

    setTimeout(() => {
      if (totalProblems > 0 && totalProblems % 10 === 0) {
        showCelebration();
      } else {
        nextProblem();
      }
    }, 2200);
  }
}

function showCelebration() {
  showScreen(celebrationScreen);
  $('celeb-score').textContent = score;
  $('celeb-streak').textContent = `Best streak: ${bestStreak}`;
  $('celeb-total').textContent = `${score} out of ${totalProblems} correct`;
  spawnConfetti();

  // Re-trigger monster animation
  const cm = $('celeb-monster');
  cm.className = 'monster';
  void cm.offsetWidth; // force reflow
  cm.className = 'monster happy';
}

// ===== EVENT LISTENERS =====
$('play-btn').addEventListener('click', () => {
  ensureAudio();
  score = 0;
  streak = 0;
  bestStreak = 0;
  totalProblems = 0;
  updateUI();
  showScreen(problemScreen);
  nextProblem();
});

$('continue-btn').addEventListener('click', () => {
  showScreen(problemScreen);
  nextProblem();
});

answerBtns.forEach(btn => {
  btn.addEventListener('click', () => handleAnswer(btn));
});

// Prevent double-tap zoom on iOS
document.addEventListener('touchend', e => {
  if (e.target.closest('button')) {
    e.preventDefault();
    e.target.closest('button').click();
  }
}, { passive: false });

// Make start monster bounce on load for fun
setTimeout(() => {
  $('start-monster').classList.add('happy');
  setTimeout(() => $('start-monster').classList.remove('happy'), 1000);
}, 500);
</script>

</body>
</html>
